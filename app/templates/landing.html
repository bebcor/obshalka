<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Общалка - Безопасные видеовстречи</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .landing-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--background);
            padding: 20px;
        }
        
        .landing-content {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        
        .landing-logo {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-primary);
        }
        
        .landing-title {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-primary);
        }
        
        .landing-subtitle {
            font-size: 1.125rem;
            color: var(--text-secondary);
            margin-bottom: 40px;
        }
        
        .landing-actions {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 40px;
        }
        
        .landing-btn {
            width: 100%;
            padding: 18px 32px;
            font-size: 1.125rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        
        .landing-btn-primary {
            background: rgba(255, 255, 255, 0.95) !important;
            color: var(--text-primary) !important;
            border: 1px solid rgba(0, 0, 0, 0.2) !important;
        }
        
        .landing-btn-primary:hover {
            background: rgba(255, 255, 255, 1) !important;
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        
        .landing-btn-secondary {
            background: rgba(255, 255, 255, 0.95) !important;
            color: var(--text-primary) !important;
            border: 1px solid rgba(0, 0, 0, 0.2) !important;
        }
        
        .landing-btn-secondary:hover {
            background: rgba(255, 255, 255, 1) !important;
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        
        .landing-btn span {
            color: var(--text-primary) !important;
        }
        
        .join-form {
            display: none;
            margin-top: 24px;
            padding: 24px;
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .join-form.active {
            display: block;
        }
        
        .join-form input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            background: var(--surface-light);
            color: var(--text-primary);
            font-size: 1rem;
            margin-bottom: 16px;
        }
        
        .join-form input:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        
        .join-form-buttons {
            display: flex;
            gap: 12px;
        }
        
        .join-form-buttons button {
            flex: 1;
        }
        
        @media (max-width: 640px) {
            .landing-title {
                font-size: 1.5rem;
            }
            
            .landing-subtitle {
                font-size: 1rem;
            }
            
            .landing-btn {
                padding: 16px 24px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="landing-container">
        <div class="landing-content">
            <div class="landing-logo"><img src="{{ url_for('static', filename='images/camera.png') }}" alt="Камера" style="width: 48px; height: 48px; vertical-align: middle; margin-right: 8px;"> Общалка</div>
            <h1 class="landing-title">Безопасные видеовстречи</h1>
            <p class="landing-subtitle">Создайте комнату или присоединитесь к существующей встрече</p>
            
            <div class="landing-actions">
                <button id="createRoomBtn" class="landing-btn landing-btn-primary">
                    <span><img src="{{ url_for('static', filename='images/plus.png') }}" alt="Создать" style="width: 20px; height: 20px; vertical-align: middle;"></span>
                    Создать встречу
                </button>
                
                <button id="joinRoomBtn" class="landing-btn landing-btn-secondary">
                    <span><img src="{{ url_for('static', filename='images/link_chain.png') }}" alt="Подключиться" style="width: 20px; height: 20px; vertical-align: middle;"></span>
                    Подключиться к встрече
                </button>
            </div>
            
            <div id="joinForm" class="join-form">
                <input type="text" id="roomIdInput" placeholder="Введите ID комнаты" maxlength="50">
                <div class="join-form-buttons">
                    <button id="confirmJoinBtn" class="landing-btn landing-btn-primary">Подключиться</button>
                    <button id="cancelJoinBtn" class="landing-btn landing-btn-secondary">Отмена</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Ждем полной загрузки DOM перед привязкой обработчиков
        document.addEventListener('DOMContentLoaded', function() {
            setupLandingPage();
        });
        
        // Если DOM уже загружен, выполняем сразу
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', setupLandingPage);
        } else {
            setupLandingPage();
        }
        
        function setupLandingPage() {
            const createRoomBtn = document.getElementById('createRoomBtn');
            const joinRoomBtn = document.getElementById('joinRoomBtn');
            const confirmJoinBtn = document.getElementById('confirmJoinBtn');
            const cancelJoinBtn = document.getElementById('cancelJoinBtn');
            const roomIdInput = document.getElementById('roomIdInput');
            
            if (!createRoomBtn || !joinRoomBtn || !confirmJoinBtn || !cancelJoinBtn) {
                console.error('Кнопки не найдены на странице');
                return;
            }
            
            createRoomBtn.addEventListener('click', async () => {
            try {
                const response = await fetch('/api/create_room', { 
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();
                
                if (data.error) {
                    alert('Ошибка: ' + data.error);
                    return;
                }
                
                // Перенаправляем на страницу комнаты
                window.location.href = `/r/${data.room_id}`;
            } catch (error) {
                alert('Ошибка при создании комнаты: ' + error.message);
            }
        });
        
        joinRoomBtn.addEventListener('click', () => {
            const joinForm = document.getElementById('joinForm');
            if (joinForm) {
                joinForm.classList.add('active');
                if (roomIdInput) roomIdInput.focus();
            }
        });
        
        cancelJoinBtn.addEventListener('click', () => {
            const joinForm = document.getElementById('joinForm');
            if (joinForm) joinForm.classList.remove('active');
            if (roomIdInput) roomIdInput.value = '';
        });
        
        confirmJoinBtn.addEventListener('click', () => {
            if (!roomIdInput) return;
            const roomId = roomIdInput.value.trim();
            if (!roomId) {
                alert('Введите ID комнаты');
                return;
            }
            
            // Валидация room_id на клиенте (только буквы, цифры, дефисы, подчеркивания)
            if (!/^[A-Za-z0-9_-]{3,50}$/.test(roomId)) {
                alert('Неверный формат ID комнаты. Используйте только буквы, цифры, дефисы и подчеркивания (3-50 символов)');
                return;
            }
            
            // Перенаправляем на страницу комнаты
            window.location.href = `/r/${roomId}`;
        });
        
        if (roomIdInput) {
            roomIdInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    confirmJoinBtn.click();
                }
            });
        }
        }
    </script>
</body>
</html>

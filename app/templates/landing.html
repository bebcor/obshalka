<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obshalka - Secure Video Conferencing</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .landing-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--background);
            padding: 20px;
        }
        
        .landing-content {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        
        .landing-logo {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-primary);
        }
        
        .landing-title {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-primary);
        }
        
        .landing-subtitle {
            font-size: 1.125rem;
            color: var(--text-secondary);
            margin-bottom: 40px;
        }
        
        .landing-actions {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 40px;
        }
        
        .landing-btn {
            width: 100%;
            padding: 18px 32px;
            font-size: 1.125rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        
        .landing-btn-primary {
            background: var(--primary-blue);
            color: white;
        }
        
        .landing-btn-primary:hover {
            background: var(--primary-blue-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        
        .landing-btn-secondary {
            background: var(--surface);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .landing-btn-secondary:hover {
            background: var(--surface-light);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        
        .join-form {
            display: none;
            margin-top: 24px;
            padding: 24px;
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .join-form.active {
            display: block;
        }
        
        .join-form input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            background: var(--surface-light);
            color: var(--text-primary);
            font-size: 1rem;
            margin-bottom: 16px;
        }
        
        .join-form input:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        
        .join-form-buttons {
            display: flex;
            gap: 12px;
        }
        
        .join-form-buttons button {
            flex: 1;
        }
        
        @media (max-width: 640px) {
            .landing-title {
                font-size: 1.5rem;
            }
            
            .landing-subtitle {
                font-size: 1rem;
            }
            
            .landing-btn {
                padding: 16px 24px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="landing-container">
        <div class="landing-content">
            <div class="landing-logo">📹 Obshalka</div>
            <h1 class="landing-title">Безопасные видеовстречи</h1>
            <p class="landing-subtitle">Создайте комнату или присоединитесь к существующей встрече</p>
            
            <div class="landing-actions">
                <button id="createRoomBtn" class="landing-btn landing-btn-primary">
                    <span>➕</span>
                    Создать встречу
                </button>
                
                <button id="joinRoomBtn" class="landing-btn landing-btn-secondary">
                    <span>🔗</span>
                    Подключиться к встрече
                </button>
            </div>
            
            <div id="joinForm" class="join-form">
                <input type="text" id="roomIdInput" placeholder="Введите ID комнаты" maxlength="50">
                <div class="join-form-buttons">
                    <button id="confirmJoinBtn" class="landing-btn landing-btn-primary">Подключиться</button>
                    <button id="cancelJoinBtn" class="landing-btn landing-btn-secondary">Отмена</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('createRoomBtn').addEventListener('click', async () => {
            try {
                const response = await fetch('/api/create_room', { 
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();
                
                if (data.error) {
                    alert('Ошибка: ' + data.error);
                    return;
                }
                
                // Перенаправляем на страницу комнаты
                window.location.href = `/r/${data.room_id}`;
            } catch (error) {
                alert('Ошибка при создании комнаты: ' + error.message);
            }
        });
        
        document.getElementById('joinRoomBtn').addEventListener('click', () => {
            const joinForm = document.getElementById('joinForm');
            joinForm.classList.add('active');
            document.getElementById('roomIdInput').focus();
        });
        
        document.getElementById('cancelJoinBtn').addEventListener('click', () => {
            document.getElementById('joinForm').classList.remove('active');
            document.getElementById('roomIdInput').value = '';
        });
        
        document.getElementById('confirmJoinBtn').addEventListener('click', () => {
            const roomId = document.getElementById('roomIdInput').value.trim();
            if (!roomId) {
                alert('Введите ID комнаты');
                return;
            }
            
            // Валидация room_id на клиенте (только буквы, цифры, дефисы, подчеркивания)
            if (!/^[A-Za-z0-9_-]{3,50}$/.test(roomId)) {
                alert('Неверный формат ID комнаты. Используйте только буквы, цифры, дефисы и подчеркивания (3-50 символов)');
                return;
            }
            
            // Перенаправляем на страницу комнаты
            window.location.href = `/r/${roomId}`;
        });
        
        document.getElementById('roomIdInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('confirmJoinBtn').click();
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Общалка - Видео Конференции</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
</head>
<body>
    <!-- Стартовое окно -->
    <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-content">
            <div class="brand-logo-large">
                <div class="logo-icon-large"><img src="{{ url_for('static', filename='images/camera.png') }}" alt="Камера"></div>
                <h1 class="brand-name-large">общалка</h1>
                <p class="brand-tagline-large">видео-конференции</p>
                <p class="welcome-description">Создайте комнату или присоединитесь к существующей встрече</p>
            </div>
            <div class="welcome-buttons">
                <button id="welcomeCreateRoom" class="btn btn-welcome btn-primary">
                    <span class="icon"><img src="{{ url_for('static', filename='images/earth.png') }}" alt="Создать"></span>
                    <span class="btn-text">Создать встречу</span>
                </button>
                <button id="welcomeJoinRoom" class="btn btn-welcome btn-secondary">
                    <span class="icon"><img src="{{ url_for('static', filename='images/keep-distance.png') }}" alt="Подключиться"></span>
                    <span class="btn-text">Подключиться к встрече</span>
                </button>
            </div>
            <div class="join-room-form" id="joinRoomForm" style="display: none;">
                <input type="text" id="welcomeRoomInput" placeholder="Введите ID комнаты" maxlength="50">
                <button id="welcomeJoinConfirm" class="btn btn-primary">
                    <span class="icon"><img src="{{ url_for('static', filename='images/checkmark.png') }}" alt="Подключиться"></span>
                    <span class="btn-text">Подключиться</span>
                </button>
                <button id="welcomeJoinCancel" class="btn btn-secondary">
                    <span class="btn-text">Отмена</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Страница отключения -->
    <div class="disconnected-screen" id="disconnectedScreen" style="display: none;">
        <div class="disconnected-content">
            <div class="disconnected-message">
                <h2>Вы отключились от встречи</h2>
                <p>Хорошего дня!</p>
            </div>
            <button id="reloadPageBtn" class="btn btn-primary">
                <span class="btn-text">Вернуться на главную страницу</span>
            </button>
        </div>
    </div>

    <div class="container" id="mainContainer" style="display: none;">
        <header class="header">
            <div class="logo">
                <div class="logo-icon"><img src="{{ url_for('static', filename='images/camera.png') }}" alt="Камера"></div>
                <span class="logo-text">Общалка</span>
            </div>
            <div class="connection-info">
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span id="connectionStatus" class="status-disconnected">Не подключено</span>
                </div>
            </div>
        </header>

        <div class="video-container">
            <div class="participants-grid" id="participantsGrid">
                <div class="participant-card local-participant" id="localParticipantCard">
                    <video id="localVideo" autoplay muted playsinline></video>
                    <div class="participant-info">
                        <span class="participant-name">Вы</span>
                        <div class="participant-status">
                            <span class="status-audio"><img src="{{ url_for('static', filename='images/microphone.png') }}" alt="Микрофон"></span>
                            <span class="status-video"><img src="{{ url_for('static', filename='images/camera.png') }}" alt="Камера"></span>
                        </div>
                    </div>
                    <div class="video-overlay" id="localVideoOverlay">
                        <div class="overlay-icon"><img src="{{ url_for('static', filename='images/camera.png') }}" alt="Камера"></div>
                        <p>Камера выключена</p>
                    </div>
                </div>
            </div>
            
            <div class="empty-state-overlay" id="emptyStateOverlay" style="display: none;">
                <!-- Плашка убрана - больше не показываем -->
            </div>
        </div>

        <div class="controls">
            <div class="room-info">
                <div class="room-info-item">
                    <span class="icon"><img src="{{ url_for('static', filename='images/door.png') }}" alt="Комната"></span>
                    <span class="info-text">Комната: <span id="roomIdDisplay">-</span></span>
                </div>
                <div class="room-info-item">
                    <span class="icon"><img src="{{ url_for('static', filename='images/people.png') }}" alt="Участники"></span>
                    <span class="info-text">Участники: <span id="participantsCount">0</span></span>
                </div>
                <button id="copyLink" class="btn btn-secondary copy-btn">
                    <span class="icon"><img src="{{ url_for('static', filename='images/link.png') }}" alt="Копировать"></span>
                </button>
            </div>

            <div class="media-controls">
                <div class="control-group">
                    <button id="showUsers" class="btn-control" title="Участники встречи">
                        <span class="icon"><img src="{{ url_for('static', filename='images/people.png') }}" alt="Участники"></span>
                    </button>
                    
                    <button id="showChat" class="btn-control" title="Чат">
                        <span class="icon"><img src="{{ url_for('static', filename='images/chat.png') }}" alt="Чат"></span>
                    </button>
                    
                    <button id="toggleAudio" class="btn-control active" title="Вкл/Выкл микрофон">
                        <span class="icon"><img src="{{ url_for('static', filename='images/microphone.png') }}" alt="Микрофон"></span>
                    </button>
                    
                    <button id="toggleVideo" class="btn-control active" title="Вкл/Выкл камеру">
                        <span class="icon"><img src="{{ url_for('static', filename='images/camera.png') }}" alt="Камера"></span>
                    </button>
                    
                    <button id="shareScreen" class="btn-control" title="Демонстрация экрана">
                        <span class="icon"><img src="{{ url_for('static', filename='images/computer.png') }}" alt="Экран"></span>
                    </button>
                </div>
                
                <button id="endCall" class="btn-end-call" title="Завершить звонок" style="display: none;">
                    <span class="icon"><img src="{{ url_for('static', filename='images/telephone-call.png') }}" alt="Завершить"></span>
                </button>

                <button id="toggleFullscreen" class="btn-control" title="Полноэкранный режим">
                    <span class="icon"><img src="{{ url_for('static', filename='images/dimensions.png') }}" alt="Полноэкранный"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- Подключаем модули JavaScript -->
    <script src="{{ url_for('static', filename='config.js') }}"></script>
    <script src="{{ url_for('static', filename='utils.js') }}"></script>
    <script src="{{ url_for('static', filename='notification.js') }}"></script>
    <script src="{{ url_for('static', filename='socket-handler.js') }}"></script>
    <script src="{{ url_for('static', filename='webrtc-manager.js') }}"></script>
    <script src="{{ url_for('static', filename='media-controller.js') }}"></script>
    <script src="{{ url_for('static', filename='room-manager.js') }}"></script>
    <script src="{{ url_for('static', filename='ui-manager.js') }}"></script>
    <script src="{{ url_for('static', filename='audio-analyzer.js') }}"></script>
    <script src="{{ url_for('static', filename='users-manager.js') }}"></script>
    <script src="{{ url_for('static', filename='chat-manager.js') }}"></script>
    <script src="{{ url_for('static', filename='media-devices.js') }}"></script>
    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>

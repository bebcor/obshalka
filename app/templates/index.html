<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoMeet - Secure Video Conferencing</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <style>
        /* Иконки для кнопок (можно заменить на SVG позже) */
        .icon { font-size: 1.25rem; }
        .mic-icon::before { content: "🎤"; }
        .video-icon::before { content: "📹"; }
        .screen-icon::before { content: "🖥️"; }
        .end-call-icon::before { content: "📞"; }
        .users-icon::before { content: "👥"; }
        .room-icon::before { content: "🚪"; }
        .logo-icon::before { content: "📹"; }
        .call-icon::before { content: "💬"; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <div class="logo-icon"></div>
                <span>VideoMeet</span>
            </div>
            <div class="connection-info">
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span id="connectionStatus" class="status-disconnected">Disconnected</span>
                </div>
            </div>
        </header>

        <!-- Main Video Area -->
        <div class="video-container">
            <!-- Remote Video Stream -->
            <div class="video-wrapper remote">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-label">Remote Participant</div>
                
                <!-- Overlay when no remote video -->
                <div class="video-overlay" id="remoteVideoOverlay">
                    <div class="overlay-icon">👤</div>
                    <p>Waiting for participant to join...</p>
                </div>
            </div>

            <!-- Local Video Stream (Picture-in-Picture) -->
            <div class="video-wrapper local">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="video-label">You</div>
                
                <!-- Overlay when no local video -->
                <div class="video-overlay" id="localVideoOverlay">
                    <div class="overlay-icon">📹</div>
                    <p>Camera is off</p>
                </div>
            </div>
        </div>

        <!-- Controls Footer -->
        <div class="controls">
            <!-- Room Controls (Left) -->
            <div class="room-controls">
                <button id="createRoom" class="btn btn-primary">
                    <span class="icon call-icon"></span>
                    Create Room
                </button>
                
                <input type="text" id="roomInput" placeholder="Enter Room ID">
                
                <button id="joinRoom" class="btn btn-primary">
                    <span class="icon room-icon"></span>
                    Join Room
                </button>
            </div>

            <!-- Room Info (Center) -->
            <div class="room-info">
                <div class="room-info-item">
                    <span class="icon room-icon"></span>
                    Room: <span id="roomIdDisplay">-</span>
                </div>
                <div class="room-info-item">
                    <span class="icon users-icon"></span>
                    Participants: <span id="participantsCount">0</span>
                </div>
            </div>

            <!-- Media Controls (Right) -->
            <div class="media-controls">
                <div class="control-group">
                    <!-- Audio Control -->
                    <button id="toggleAudio" class="btn-control active" title="Mute/Unmute">
                        <span class="icon mic-icon"></span>
                    </button>
                    
                    <!-- Video Control -->
                    <button id="toggleVideo" class="btn-control active" title="Video On/Off">
                        <span class="icon video-icon"></span>
                    </button>
                    
                    <!-- Screen Share -->
                    <button id="shareScreen" class="btn-control" title="Share Screen">
                        <span class="icon screen-icon"></span>
                    </button>
                </div>
                
                <!-- End Call Button -->
                <button id="endCall" class="btn-end-call" title="End Call" style="display: none;">
                    <span class="icon end-call-icon"></span>
                </button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>

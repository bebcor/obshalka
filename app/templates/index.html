<!DOCTYPE html>
<html>
<head>
    <title>VideoMeet - Secure Video Conferencing</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>VideoMeet</h1>
            <div class="connection-info">
                Status: <span id="connectionStatus" class="status-disconnected">Disconnected</span>
            </div>
        </div>
        
        <div class="controls">
            <div class="room-controls">
                <button id="createRoom" class="btn-primary">Create Room</button>
                <input type="text" id="roomInput" placeholder="Enter Room ID">
                <button id="joinRoom" class="btn-primary">Join Room</button>
            </div>
            
            <div class="room-info">
                <div>Room ID: <span id="roomIdDisplay">-</span></div>
                <div>Participants: <span id="participantsCount">0</span></div>
            </div>
            
            <div class="media-controls">
                <button id="toggleAudio" class="btn-control">🔊</button>
                <button id="toggleVideo" class="btn-control">📷</button>
                <button id="shareScreen" class="btn-control">🖥️</button>
            </div>
        </div>
        
        <div class="video-container">
            <div class="video-wrapper">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="video-label">You</div>
            </div>
            <div class="video-wrapper">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-label">Remote</div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>

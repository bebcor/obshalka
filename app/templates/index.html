<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obshalka - Видео Конференции</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
</head>
<body>
    <!-- Начальная страница -->
    <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-content">
            <div class="brand-logo-large">
                <div class="logo-icon-large">📹</div>
                <h1 class="brand-name-large">obshalka</h1>
                <p class="brand-tagline-large">видео-конференции</p>
            </div>
            <div class="welcome-buttons">
                <button id="welcomeCreateRoom" class="btn btn-welcome btn-primary">
                    <span class="icon">💬</span>
                    <span class="btn-text">Создать встречу</span>
                </button>
                <button id="welcomeJoinRoom" class="btn btn-welcome btn-secondary">
                    <span class="icon">🚪</span>
                    <span class="btn-text">Подключиться к встрече</span>
                </button>
            </div>
            <div class="join-room-form" id="joinRoomForm" style="display: none;">
                <input type="text" id="welcomeRoomInput" placeholder="Введите ID комнаты" maxlength="20">
                <button id="welcomeJoinConfirm" class="btn btn-primary">
                    <span class="icon">✓</span>
                    <span class="btn-text">Подключиться</span>
                </button>
                <button id="welcomeJoinCancel" class="btn btn-secondary">
                    <span class="btn-text">Отмена</span>
                </button>
            </div>
        </div>
    </div>

    <div class="container" id="mainContainer" style="display: none;">
        <header class="header">
            <div class="logo">
                <div class="logo-icon">📹</div>
                <span class="logo-text">Obshalka</span>
            </div>
            <div class="connection-info">
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span id="connectionStatus" class="status-disconnected">Не подключено</span>
                </div>
            </div>
        </header>

        <div class="video-container">
            <div class="participants-grid" id="participantsGrid">
                <div class="participant-card local-participant" id="localParticipantCard">
                    <video id="localVideo" autoplay muted playsinline></video>
                    <div class="participant-info">
                        <span class="participant-name">Вы</span>
                        <div class="participant-status">
                            <span class="status-audio">🎤</span>
                            <span class="status-video">📹</span>
                        </div>
                    </div>
                    <div class="video-overlay" id="localVideoOverlay">
                        <div class="overlay-icon">📹</div>
                        <p>Камера выключена</p>
                    </div>
                </div>
            </div>
            
            <div class="empty-state-overlay" id="emptyStateOverlay">
                <div class="brand-logo">
                    <div class="logo-icon-large">📹</div>
                    <h1 class="brand-name">obshalka</h1>
                    <p class="brand-tagline">видео-конференции</p>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="room-controls">
                <button id="createRoom" class="btn btn-primary">
                    <span class="icon">💬</span>
                    <span class="btn-text">Создать комнату</span>
                </button>
                
                <div class="input-group">
                    <input type="text" id="roomInput" placeholder="Введите ID комнаты">
                    <button id="joinRoom" class="btn btn-primary">
                        <span class="icon">🚪</span>
                        <span class="btn-text">Войти</span>
                    </button>
                </div>
            </div>

            <div class="room-info">
                <div class="room-info-item">
                    <span class="icon">🚪</span>
                    <span class="info-text">Комната: <span id="roomIdDisplay">-</span></span>
                </div>
                <div class="room-info-item">
                    <span class="icon">👥</span>
                    <span class="info-text">Участники: <span id="participantsCount">0</span></span>
                </div>
                <button id="copyLink" class="btn btn-secondary copy-btn">
                    <span class="icon">📋</span>
                </button>
            </div>

            <div class="media-controls">
                <div class="control-group">
                    <button id="toggleAudio" class="btn-control active" title="Вкл/Выкл микрофон">
                        <span class="icon">🎤</span>
                    </button>
                    
                    <button id="toggleVideo" class="btn-control active" title="Вкл/Выкл камеру">
                        <span class="icon">📹</span>
                    </button>
                    
                    <button id="shareScreen" class="btn-control" title="Демонстрация экрана">
                        <span class="icon">🖥️</span>
                    </button>
                    
                    <button id="showParticipants" class="btn-control" title="Участники">
                        <span class="icon">👥</span>
                    </button>
                    
                    <button id="showChat" class="btn-control" title="Чат">
                        <span class="icon">💬</span>
                    </button>
                </div>
                
                <button id="endCall" class="btn-end-call" title="Завершить звонок" style="display: none;">
                    <span class="icon">📞</span>
                </button>

                <button id="toggleFullscreen" class="btn-control" title="Полноэкранный режим">
                    <span class="icon">⛶</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Модальное окно участников -->
    <div class="modal-overlay" id="participantsModal" style="display: none;">
        <div class="modal-content">
            <h3>👥 Участники встречи</h3>
            <div class="participants-list" id="participantsList">
                <p class="loading-text">Загрузка...</p>
            </div>
            <div class="modal-buttons">
                <button id="closeParticipantsModal" class="btn btn-secondary">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно чата -->
    <div class="modal-overlay" id="chatModal" style="display: none;">
        <div class="modal-content chat-modal-content">
            <h3>💬 Чат</h3>
            <div class="chat-messages" id="chatMessages">
                <p class="empty-chat">Пока нет сообщений</p>
            </div>
            <div class="chat-input-container">
                <input type="text" id="chatInput" placeholder="Введите сообщение..." maxlength="500">
                <button id="sendChatMessage" class="btn btn-primary">Отправить</button>
            </div>
            <div class="modal-buttons">
                <button id="closeChatModal" class="btn btn-secondary">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- Подключаем модули JavaScript -->
    <script src="{{ url_for('static', filename='js/config.js') }}"></script>
    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/media-devices.js') }}"></script>
    <script src="{{ url_for('static', filename='js/audio-visualizer.js') }}"></script>
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
    <script src="{{ url_for('static', filename='js/participants.js') }}"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
